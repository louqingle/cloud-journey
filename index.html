shardPositions.forEach((p,i)=>{let group=new THREE.Group();let gem=new THREE.Mesh(new THREE.OctahedronGeometry(.48,1),shardMat);gem.scale.set(.8,1.45,.8);group.add(gem);let halo=new THREE.Mesh(new THREE.TorusGeometry(.72,.025,6,40),new THREE.MeshBasicMaterial({color:0xffedc1,transparent:true,opacity:.75}));group.add(halo);let light=new THREE.PointLight(0xffd47b,1.5,9);group.add(light);group.position.set(...p);scene.add(group);shards.push({group,got:false,phase:i})});
let got=JSON.parse(localStorage.getItem('cloud_got')||'[]');shards.forEach((s,i)=>{if(got.includes(i)){s.got=true;s.group.visible=false}});let count=got.length,energy=100,started=false,flying=false,yaw=0,cameraYaw=0,cameraPitch=-.12;const velocity=new THREE.Vector3();const input={x:0,y:0};
