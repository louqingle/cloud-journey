const stick=$('stick'),knob=$('knob');let stickOn=false;

stick.addEventListener('pointerdown',e=>{stickOn=true;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(stickOn)moveStick(e)});function release(){stickOn=false;input.x=input.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
const look=$('look');let looking=false,lx=0,ly=0;
look.addEventListener('pointerdown',e=>{looking=true;lx=e.clientX;ly=e.clientY;look.setPointerCapture(e.pointerId)});
look.addEventListener('pointermove',e=>{if(!looking)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;cameraYaw-=dx*.006;cameraPitch=clamp(cameraPitch-dy*.005,-1.02,.78)});
function endLook(){looking=false}look.addEventListener('pointerup',endLook);look.addEventListener('pointercancel',endLook);
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(player.position.y<.35&&!flying)velocity.y=8.4});
$('fly').addEventListener('pointerdown',e=>{e.preventDefault();if(!flying&&energy>2){flying=true;toast('滑翔已开启 · 感受风的方向')}else{flying=false;toast('收起披风')}});$('begin').onclick=()=>{$('start').style.display='none';$('hud').classList.add('active');started=true;toast('旅程开始了')};
const pads=islandData.map(p=>[p[0],p[1]+2*p[3],p[2],p[3]*10]);
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.035);last=now;const t=now*.001;
 cloudGroups.forEach((g,i)=>{g.position.x+=Math.sin(t*.11+i)*dt*.55;g.position.z+=Math.cos(t*.08+i)*dt*.24});
 shards.forEach(s=>{if(!s.got){s.group.rotation.y+=dt*.7;s.group.position.y+=Math.sin(t*1.7+s.phase)*dt*.11}});
 let moving=false;
 if(started){const forward=new THREE.Vector3(Math.sin(cameraYaw)*Math.cos(cameraPitch),Math.sin(cameraPitch),-Math.cos(cameraYaw)*Math.cos(cameraPitch)),right=new THREE.Vector3(Math.cos(cameraYaw),0,Math.sin(cameraYaw));const dir=forward.clone().multiplyScalar(-input.y).add(right.clone().multiplyScalar(input.x));if(dir.lengthSq()>1)dir.normalize();moving=dir.lengthSq()>.002;
 if(flying&&energy>0){if(moving)velocity.addScaledVector(dir,18*dt);if(velocity.length()>15)velocity.setLength(15);velocity.multiplyScalar(Math.pow(.986,dt*60));energy=Math.max(0,energy-9.5*dt);if(energy<=0){flying=false;toast('能量耗尽，正在下降')}}else{if(moving){const gd=new THREE.Vector3(Math.sin(cameraYaw),0,-Math.cos(cameraYaw)).multiplyScalar(-input.y).add(right.clone().multiplyScalar(input.x));if(gd.lengthSq()>1)gd.normalize();velocity.x=THREE.MathUtils.damp(velocity.x,gd.x*5.4,9,dt);velocity.z=THREE.MathUtils.damp(velocity.z,gd.z*5.4,9,dt)}else{velocity.x=THREE.MathUtils.damp(velocity.x,0,5,dt);velocity.z=THREE.MathUtils.damp(velocity.z,0,5,dt)}velocity.y-=15.5*dt;energy=Math.min(100,energy+7*dt)}
 player.position.addScaledVector(velocity,dt);if(player.position.y<0){player.position.y=0;velocity.y=0;if(flying){flying=false;toast('已平稳降落')}}
 for(const [x,y,z,r] of pads){const d=Math.hypot(player.position.x-x,player.position.z-z);if(d<r&&player.position.y<y+1.8&&player.position.y>y-.7&&velocity.y<0){player.position.y=y+.12;velocity.y=0}}
 if(Math.hypot(velocity.x,velocity.z)>.25){yaw=Math.atan2(velocity.x,-velocity.z);player.rotation.y=THREE.MathUtils.damp(player.rotation.y,yaw,7,dt)}
 const side=velocity.x*Math.cos(cameraYaw)-velocity.z*Math.sin(cameraYaw);player.rotation.z=THREE.MathUtils.damp(player.rotation.z,clamp(-side*.035,-.28,.28),5,dt);player.rotation.x=THREE.MathUtils.damp(player.rotation.x,flying?-clamp(velocity.y*.025,-.18,.3):0,5,dt);
 shards.forEach((s,i)=>{if(!s.got&&player.position.distanceTo(s.group.position)<2.35){s.got=true;s.group.visible=false;got.push(i);count=got.length;try{localStorage.setItem('cloud_got',JSON.stringify(got))}catch{}energy=Math.min(100,energy+20);toast('✧ 收集到一枚微光')}});updateHud()}
 const p=cape.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=capeBase[i*3],y=capeBase[i*3+1],tail=Math.max(0,-y),edge=Math.abs(x)/.95;const wave=Math.sin(t*2.2+y*1.8+x*2.3)*(.025+tail*.07)+Math.sin(t*5+y*5+x*3)*(.01+tail*.022);const lift=flying?tail*(.34+Math.max(0,-velocity.z)*.016):0;p.setZ(i,capeBase[i*3+2]+wave+lift+edge*Math.sin(t*1.8+y*2)*.025)}p.needsUpdate=true;cape.geometry.computeVertexNormals();
 const gait=moving&&!flying?Math.sin(t*9.5)*.32:0;legRigs[0].rotation.x=gait;legRigs[1].rotation.x=-gait;armRigs[0].rotation.x=flying?-.8:-gait*.65;armRigs[1].rotation.x=flying?-.8:gait*.65;armRigs[0].rotation.z=THREE.MathUtils.damp(armRigs[0].rotation.z,flying?-.4:-.08,5,dt);armRigs[1].rotation.z=THREE.MathUtils.damp(armRigs[1].rotation.z,flying?.4:.08,5,dt);torso.rotation.z=THREE.MathUtils.damp(torso.rotation.z,moving?Math.sin(t*8)*.02:0,6,dt);mantle.rotation.z=flying?Math.sin(t*4)*.025:0;halo.intensity=1.15+Math.sin(t*3)*.28;
 const cf=new THREE.Vector3(Math.sin(cameraYaw)*Math.cos(cameraPitch),Math.sin(cameraPitch),-Math.cos(cameraYaw)*Math.cos(cameraPitch));const target=player.position.clone().add(new THREE.Vector3(0,2.75,0)).addScaledVector(cf,-9.2);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.4,0)).addScaledVector(cf,4.5));renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('loading').style.display='none';
</script>
</body></html>
