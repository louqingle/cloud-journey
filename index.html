<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8bc8e8"><title>云境 · Cloud Journey</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8bc8e8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 12px #24516a99}
.top{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:12px;letter-spacing:4px;font-weight:700;opacity:.9}.stats{font-size:12px;text-align:right;line-height:1.8}
#energyWrap{position:absolute;top:calc(env(safe-area-inset-top) + 62px);right:18px;width:112px;height:5px;background:#ffffff55;border-radius:9px;overflow:hidden}#energy{height:100%;width:100%;background:#fff;border-radius:9px;transition:width .15s}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 86px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:1px;opacity:.9}
#controls{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 24px);left:0;right:0;height:142px;display:flex;justify-content:space-between;align-items:end;padding:0 24px;pointer-events:none}
#stick{width:124px;height:124px;border:1px solid #ffffff70;border-radius:50%;background:#ffffff1b;position:relative;pointer-events:auto;backdrop-filter:blur(5px)}
#knob{width:48px;height:48px;border-radius:50%;position:absolute;left:37px;top:37px;background:#ffffffb8;box-shadow:0 3px 14px #255b7766}
.actions{display:flex;gap:13px;align-items:end;pointer-events:auto}.action{border:1px solid #ffffff80;background:#ffffff30;color:white;border-radius:50%;width:66px;height:66px;font-size:12px;font-weight:600;backdrop-filter:blur(8px);box-shadow:0 4px 18px #255b7733}.action.primary{width:78px;height:78px;background:#fff;color:#39718c;border:0}
#start{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#6faed1aa,#d4eaf0aa);backdrop-filter:blur(7px);color:white;text-align:center;padding:28px}
.panel{max-width:340px}.eyebrow{font-size:11px;letter-spacing:5px;opacity:.9}.title{font-size:42px;letter-spacing:8px;margin:16px 0 8px;font-weight:300}.sub{font-size:13px;line-height:2;opacity:.95}.startbtn{margin-top:30px;border:0;border-radius:30px;padding:15px 42px;background:white;color:#477f9b;font-size:14px;letter-spacing:2px;font-weight:700;box-shadow:0 8px 28px #24516a33}
#toast{position:absolute;bottom:190px;left:0;right:0;text-align:center;font-size:13px;opacity:0;transition:opacity .3s}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:white;font-size:13px;letter-spacing:2px;z-index:8}
@media(min-width:700px){#controls{max-width:800px;margin:auto}.top{max-width:900px;left:50%;right:auto;width:calc(100% - 40px);transform:translateX(-50%)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="loading">正在唤醒云境…</div>
<div id="hud"><div class="top"><div class="brand">CLOUD JOURNEY</div><div class="stats"><span id="count">✧ 0 / 12</span><br><span id="saved">旅程已准备</span></div></div><div id="energyWrap"><div id="energy"></div></div><div id="hint">拖动左侧圆盘移动 · 靠近光之碎片收集</div><div id="toast"></div>
<div id="controls"><div id="stick"><div id="knob"></div></div><div class="actions"><button class="action" id="jump">跳跃</button><button class="action primary" id="fly">飞行</button></div></div></div>
<div id="start"><div class="panel"><div class="eyebrow">A QUIET WORLD ABOVE THE CLOUDS</div><div class="title">云 境</div><div class="sub">穿过云海，寻找散落的微光。<br>慢一点，看看这个世界。</div><button class="startbtn" id="begin">进入云境</button></div></div>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd0e8);scene.fog=new THREE.FogExp2(0xa9d9e9,.008);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9f8ff,0x7899a2,2.0));
const sun=new THREE.DirectionalLight(0xfff1d5,2.4);sun.position.set(-35,60,25);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const islandMat=mat(0x6eaa9b),topMat=mat(0x9cc9a9),rockMat=mat(0x789b91),goldMat=new THREE.MeshStandardMaterial({color:0xffe6a1,emissive:0xffc85b,emissiveIntensity:1.8,roughness:.25});
const ground=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),mat(0x9bcde0));ground.scale.y=.12;ground.position.y=-58;scene.add(ground);
function island(x,y,z,s=1){
 const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);scene.add(g);
 const base=new THREE.Mesh(new THREE.CylinderGeometry(5.7,3.5,5.8,9,1),islandMat);base.position.y=-2; g.add(base);
 const cap=new THREE.Mesh(new THREE.CylinderGeometry(5.9,5.6,1.1,9),topMat);cap.position.y=.65;g.add(cap);
 for(let i=0;i<7;i++){let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.7+Math.random()*.7,0),rockMat);rock.position.set((Math.random()-.5)*8,-4-Math.random()*2,(Math.random()-.5)*8);g.add(rock)}
 for(let i=0;i<4;i++){let tree=new THREE.Group();let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.22,2,6),mat(0x7b8971));trunk.position.y=1;tree.add(trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.1,1),mat([0x6faaa0,0x8bb9a2,0xacc8a2][i%3]));crown.position.y=2.2;tree.add(crown);tree.position.set((Math.random()-.5)*7,1,(Math.random()-.5)*7);g.add(tree)}
 return g;
}
island(0,0,0,1.25);island(-19,7,-29,.78);island(22,12,-53,1.05);island(-30,17,-78,.9);island(10,23,-102,1.1);island(39,29,-133,.85);island(-16,33,-158,1.1);island(18,40,-190,1.25);
const cloudMat=new THREE.MeshStandardMaterial({color:0xf3fbff,roughness:1,transparent:true,opacity:.8});
for(let i=0;i<95;i++){let c=new THREE.Group();let x=(Math.random()-.5)*230,y=-5+Math.random()*52,z=-Math.random()*260;for(let j=0;j<5;j++){let p=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*3,9,7),cloudMat);p.position.set((Math.random()-.5)*7,(Math.random()-.5)*2,(Math.random()-.5)*5);p.scale.y=.55;c.add(p)}c.position.set(x,y,z);scene.add(c)}
// soft distant floating arches
for(let i=0;i<5;i++){let ring=new THREE.Mesh(new THREE.TorusGeometry(8+i*1.5,.18,8,64),new THREE.MeshStandardMaterial({color:0xe9f7f7,transparent:true,opacity:.25}));ring.position.set((i%2?1:-1)*(30+i*4),18+i*5,-60-i*35);ring.rotation.x=Math.PI/2.5;scene.add(ring)}
// player
const player=new THREE.Group();scene.add(player);
const robe=mat(0xf0eee0,.65),skin=mat(0xf2c7a3),cape=new THREE.MeshStandardMaterial({color:0xd6e9e9,roughness:.7,side:THREE.DoubleSide});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,5,9),robe);body.position.y=1.15;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skin);head.position.y=2.05;player.add(head);
const hood=new THREE.Mesh(new THREE.SphereGeometry(.47,16,12,0,Math.PI*2,0,Math.PI*.58),mat(0xd8e8e8));hood.position.y=2.14;player.add(hood);
const capeGeo=new THREE.BufferGeometry();const capeVerts=new Float32Array([-.35,1.8,.18,.35,1.8,.18,-.7,.1,.65,.7,.1,.65]);capeGeo.setAttribute('position',new THREE.BufferAttribute(capeVerts,3));capeGeo.setIndex([0,2,1,1,2,3]);capeGeo.computeVertexNormals();const capeMesh=new THREE.Mesh(capeGeo,cape);player.add(capeMesh);
const footMat=mat(0x627c82);for(let x of [-.23,.23]){let f=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.42,3,7),footMat);f.position.set(x,.25,0);player.add(f)}
player.position.set(0,0,2);
const halo=new THREE.PointLight(0xffe5a5,1.2,8);halo.position.y=2;player.add(halo);
const shards=[];const positions=[[-7,3,-12],[-19,10,-29],[20,15,-52],[-29,20,-77],[10,26,-101],[39,32,-132],[-16,36,-157],[18,43,-189],[-5,6,-6],[25,17,-58],[-36,22,-82],[8,48,-194]];
positions.forEach((p,i)=>{let group=new THREE.Group();let gem=new THREE.Mesh(new THREE.OctahedronGeometry(.48),goldMat);group.add(gem);let glow=new THREE.PointLight(0xffd982,1.4,7);group.add(glow);group.position.set(...p);scene.add(group);shards.push({group,got:false,phase:i})});
let count=Number(localStorage.getItem('cloud_shards')||0);let got=JSON.parse(localStorage.getItem('cloud_got')||'[]');shards.forEach((s,i)=>{if(got.includes(i)){s.got=true;s.group.visible=false}});count=got.length;
let energy=100,flying=false,started=false,velY=0,velX=0,velZ=0,yaw=0;const input={x:0,y:0};let last=performance.now();
const updateHud=()=>{$('count').textContent='✧ '+count+' / 12';$('energy').style.width=energy+'%';$('saved').textContent=count===12?'微光已全部寻回':'已收集 '+count+' 枚微光'};
updateHud();
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.opacity=0,1900)}
function setStick(e){const r=$('stick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=42;if(l>max){dx=dx/l*max;dy=dy/l*max}input.x=dx/max;input.y=dy/max;$('knob').style.transform='translate('+dx+'px,'+dy+'px)'}
let stickOn=false;const stick=$('stick');stick.addEventListener('pointerdown',e=>{stickOn=true;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(stickOn)setStick(e)});function release(){stickOn=false;input.x=input.y=0;$('knob').style.transform='translate(0,0)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(!flying&&player.position.y<.2)velY=8.5});$('fly').addEventListener('pointerdown',e=>{e.preventDefault();flying=true;toast('展开斗篷，乘风而上')});$('fly').addEventListener('pointerup',()=>flying=false);$('fly').addEventListener('pointercancel',()=>flying=false);$('fly').addEventListener('pointerleave',()=>flying=false);
$('begin').onclick=()=>{$('start').style.display='none';started=true;toast('旅程开始了')};
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;let t=now*.001;
 shards.forEach(s=>{if(!s.got){s.group.rotation.y+=dt*.8;s.group.position.y+=Math.sin(t*1.6+s.phase)*dt*.18}});
 if(started){
  let forward=-input.y,side=input.x;let moving=Math.abs(forward)+Math.abs(side)>.04;
  const speed=flying?12:6.2;let dx=side*Math.cos(yaw)+forward*Math.sin(yaw),dz=-forward*Math.cos(yaw)+side*Math.sin(yaw);
  if(moving){let target=Math.atan2(dx,-dz);yaw=target;player.rotation.y=yaw;player.position.x+=dx*speed*dt;player.position.z+=dz*speed*dt}
  if(flying&&energy>0){velY=4.2;energy=Math.max(0,energy-13*dt)}else{velY-=17*dt;energy=Math.min(100,energy+5*dt)}
  player.position.y+=velY*dt;
  if(player.position.y<0){player.position.y=0;velY=0}
  // island platforms as gentle landing zones
  const pads=[[0,0,0,7.1],[-19,7,-29,4.6],[22,12,-53,6],[-30,17,-78,5.2],[10,23,-102,6.3],[39,29,-133,4.8],[-16,33,-158,6],[18,40,-190,7.2]];
  for(const [x,y,z,r] of pads){let d=Math.hypot(player.position.x-x,player.position.z-z);if(d<r&&player.position.y<y+1.4&&player.position.y>y-.5&&velY<0){player.position.y=y+1.35;velY=0}}
  // collect light
  shards.forEach((s,i)=>{if(!s.got&&player.position.distanceTo(s.group.position)<2.5){s.got=true;s.group.visible=false;got.push(i);count=got.length;localStorage.setItem('cloud_got',JSON.stringify(got));localStorage.setItem('cloud_shards',String(count));energy=Math.min(100,energy+18);updateHud();toast('✧ 收集到一枚微光')}})
 }
 const target=new THREE.Vector3(player.position.x,player.position.y+2.6,player.position.z+7.5);camera.position.lerp(target,.075);const look=new THREE.Vector3(player.position.x,player.position.y+1.3,player.position.z-4);camera.lookAt(look);
 const sway=Math.sin(t*4)*.035;body.rotation.z=moving?Math.sin(t*9)*.07:0;capeMesh.rotation.x=flying?-.3+sway:sway;capeMesh.rotation.z=Math.sin(t*3)*.04;
 halo.intensity=.8+Math.sin(t*3)*.25;updateHud();renderer.render(scene,camera);
}
let moving=false;requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
$('loading').style.display='none';
</script>
</body></html>
