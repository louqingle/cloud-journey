<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#12221f"><title>王者战域 · Kingdom Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132923;color:#f2eee1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.panel{background:#10201de8;border:1px solid #d6bd7a66;border-radius:12px;backdrop-filter:blur(10px)}.top{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:7px 14px;display:flex;gap:15px;font-size:12px;white-space:nowrap}.score{font-size:18px;color:#f0d28d;font-weight:900}.info{position:absolute;top:9px;left:9px;width:155px;padding:9px;font-size:12px}.bar{height:7px;background:#263a35;border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#49ce83}.bar .mp{background:#53a9ed}.mini{position:absolute;right:9px;top:9px;width:94px;height:68px;border:1px solid #cbb77888;border-radius:8px;background:#142b23}.joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#dcebd51c;border:1px solid #e3e9d866;pointer-events:auto}.stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,#7b9b8eaa);border:1px solid #fff8}.actions{position:absolute;right:17px;bottom:20px;display:flex;align-items:end;gap:8px;pointer-events:auto}.act{border:1px solid #e6d39b99;border-radius:50%;color:white;background:radial-gradient(circle at 35% 25%,#62827a,#182f32);width:54px;height:54px;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center}.act small{font-size:9px;color:#e4e2d4}.attack{width:68px;height:68px;background:radial-gradient(circle at 35% 25%,#d5a15c,#693d26);font-size:24px}.ult{width:61px;height:61px;background:radial-gradient(circle at 35% 25%,#b99be7,#49316c)}#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#31584b,#0a1719)}#menu{width:min(690px,96vw);padding:22px;border:1px solid #d2b56d77;border-radius:18px;background:linear-gradient(145deg,#203b35f5,#101d27f5)}h1{text-align:center;color:#f1d99e;letter-spacing:7px;font:bold clamp(30px,6vw,48px) Georgia;margin:0}#sub{text-align:center;color:#a9c4b4;font-size:10px;letter-spacing:4px;margin:7px 0 22px}.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.role{padding:11px 4px;text-align:center;border:1px solid #b9c5ad44;border-radius:11px;background:#ffffff08}.role.sel{border-color:#f0d28d;background:#d6b66a22}.role b{display:block;font-size:13px;margin:5px 0}.role small{font-size:10px;color:#adc0b4}.em{font-size:25px}.rules{margin:16px 0;padding:12px;border-left:2px solid #d7bd79;background:#ffffff08;color:#c2d0c6;font-size:12px;line-height:1.7}.primary{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#c99b53,#f0d99b);color:#1c2822;font-size:16px;font-weight:900;letter-spacing:3px}.secondary{display:block;margin:12px auto 0;background:none;border:0;color:#a9c0b4;font-size:12px}#toast{position:fixed;z-index:8;top:22%;left:50%;transform:translateX(-50%);padding:9px 17px;border-radius:30px;background:#10201deF;border:1px solid #d7bd79;color:#f4d99c;font-size:13px;opacity:0;pointer-events:none}#end{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#07110fe8}.endbox{width:min(340px,90vw);padding:25px;text-align:center}#rotate{display:none;position:fixed;inset:0;z-index:20;background:#101d20;color:#efd99e;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:2}@media(orientation:portrait){#rotate{display:flex}}@media(max-width:600px){#menu{padding:16px}.role{padding:8px 1px}.role b{font-size:11px}.role small{font-size:9px}.info{width:135px}.mini{width:80px;height:58px}.joy{width:108px;height:108px}.stick{left:29px;top:29px}.actions{gap:6px}.act{width:48px;height:48px}.attack{width:61px;height:61px}.ult{width:55px;height:55px}}.hidden{display:none!important}
</style></head><body>
<canvas id="game"></canvas><div id="rotate">请将手机横屏<br><small>横屏操作，体验完整战场</small></div>
<div id="hud" class="hidden"><div class="top panel"><span class="score" id="score">0 : 0</span><span id="clock">00:00</span><span>摧毁敌方水晶</span></div><div class="info panel"><b id="heroName">英雄</b><span id="lv" style="float:right;color:#f0d28d">Lv.1</span><div class="bar"><i id="hpbar" style="width:100%"></i></div><div class="bar"><i class="mp" id="mpbar" style="width:100%"></i></div><div style="display:flex;justify-content:space-between;margin-top:5px;color:#c7d5ca"><span id="gold">金币 300</span><span id="xp">0 XP</span></div></div><canvas id="mini" class="mini" width="200" height="145"></canvas><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><div class="act" id="s1">✦<small>技能1</small></div><div class="act" id="s2">❖<small>技能2</small></div><div class="act ult" id="ult">✹<small>大招</small></div><div class="act attack" id="atk">⚔<small>普攻</small></div></div></div>
<div id="toast"></div><div id="overlay"><div id="menu"><h1>王者战域</h1><div id="sub">KINGDOM ARENA · FIVE AGAINST FIVE</div><div style="text-align:center;color:#e0c98f;font-size:13px;margin-bottom:13px">选择你的英雄位置</div><div class="roles" id="roles"></div><div class="rules"><b style="color:#efd99e">战场规则</b><br>你将带领四名电脑队友，对抗五名敌方英雄。三路兵线自动交锋，击败敌人、补兵和摧毁防御塔可获得金币经验。靠近目标攻击，最终摧毁敌方水晶。</div><button class="primary" id="start">进入战场</button><button class="secondary" id="help">操作说明：左侧摇杆移动，右侧按钮攻击和释放技能</button></div></div>
<div id="end" class="hidden"><div class="endbox panel"><div id="result" style="font-size:30px;color:#f0d28d;font-weight:900">胜利</div><p id="resultText" style="font-size:13px;color:#c1d0c6"></p><button class="primary" id="again">再来一局</button><button class="secondary" id="back">返回选英雄</button></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),mc=$('mini').getContext('2d');let W,H,S,hero,units=[],minions=[],towers=[],cores=[],shots=[],running=false,last=0,time=0,kills=[0,0],wave=0,choice='mage',move={x:0,y:0},skillcd=[0,0,0];
const roles={mage:{name:'星术师',job:'法师',icon:'🔮',desc:'爆发法术·中路',hp:780,atk:58,range:150,speed:150,color:'#b79aef'},marksman:{name:'银弦',job:'射手',icon:'🏹',desc:'远程持续·发育路',hp:690,atk:43,range:205,speed:158,color:'#e4c17b'},support:{name:'圣愈使',job:'辅助',icon:'🌿',desc:'治疗护盾·游走位',hp:930,atk:31,range:135,speed:150,color:'#76caa3'},jungle:{name:'影刃',job:'打野',icon:'🗡️',desc:'突袭收割·野区',hp:850,atk:53,range:95,speed:190,color:'#e18e7e'},tank:{name:'磐石',job:'坦克',icon:'🛡️',desc:'前排承伤·对抗路',hp:1450,atk:38,range:90,speed:132,color:'#83bbc4'}};
Object.entries(roles).forEach(([k,r])=>{let el=document.createElement('div');el.className='role'+(k===choice?' sel':'');el.innerHTML='<div class="em">'+r.icon+'</div><b>'+r.job+'</b><small>'+r.desc+'</small>';el.addEventListener('click',()=>{choice=k;document.querySelectorAll('.role').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')});$('roles').append(el)});
function resize(){let d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(d,0,0,d,0,0);S=Math.min(W/950,H/700)*1.18}addEventListener('resize',resize);resize();
const lanes={top:[[100,650],[240,550],[380,430],[500,380],[630,280],[770,170],[900,90]],mid:[[100,650],[250,590],[390,500],[500,380],[610,260],[750,160],[900,90]],bot:[[100,650],[220,520],[340,390],[500,380],[660,370],[790,230],[900,90]]};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),pt=(l,t)=>{let a=lanes[l],n=(a.length-1)*t,i=Math.min(Math.floor(n),a.length-2),f=n-i;return{x:a[i][0]*(1-f)+a[i+1][0]*f,y:a[i][1]*(1-f)+a[i+1][1]*f}};
function make(team,kind,x,y,job,lane){let r=roles[job]||roles.mage;return{team,kind,x,y,job,lane,hp:r.hp,max:r.hp,atk:r.atk,range:r.range,speed:r.speed,alive:true,cd:0,lv:1,progress:team?1:0,gold:0,xp:0}}
function minion(team,l,t){let p=pt(l,t);return{team,kind:'minion',x:p.x,y:p.y,lane:l,hp:250,max:250,atk:19,range:54,speed:48,alive:true,cd:0,progress:team?1:0}}
function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,1200)}
function start(){time=0;kills=[0,0];wave=0;units=[];minions=[];shots=[];towers=[];cores=[];skillcd=[0,0,0];hero=make(0,'hero',130,625,choice,'mid');hero.gold=300;['mage','marksman','support','jungle','tank'].filter(x=>x!==choice).slice(0,4).forEach((r,i)=>units.push(make(0,'bot',140+i*5,615-i*7,r,['top','mid','bot','mid'][i])));['mage','marksman','support','jungle','tank'].forEach((r,i)=>units.push(make(1,'bot',860-i*5,125+i*7,r,['top','mid','bot','top','mid'][i])));['top','mid','bot'].forEach(l=>{[.27,.52,.76].forEach(t=>{let a=pt(l,t),b=pt(l,1-t);towers.push({team:0,lane:l,x:a.x,y:a.y,hp:1000,max:1000,cd:0,alive:true},{team:1,lane:l,x:b.x,y:b.y,hp:1000,max:1000,cd:0,alive:true})})});cores=[{team:0,x:75,y:690,hp:2800,max:2800},{team:1,x:930,y:55,hp:2800,max:2800}];spawn();$('overlay').classList.add('hidden');$('end').classList.add('hidden');$('hud').classList.remove('hidden');$('heroName').textContent=roles[choice].name+' · '+roles[choice].job;running=true;last=performance.now();requestAnimationFrame(loop);toast('兵线已出发！向敌方水晶推进')}
function spawn(){wave++;['top','mid','bot'].forEach(l=>{for(let i=0;i<3;i++){minions.push(minion(0,l,.03+i*.012),minion(1,l,.97-i*.012))}})}
function nearest(u,r=270){return [...units,...minions].filter(v=>v.alive&&v.team!==u.team&&dist(u,v)<r).sort((a,b)=>dist(u,a)-dist(u,b))[0]||null}
function hit(t,n,team){if(!t||t.hp<=0)return;t.hp-=n;if(t.hp<=0){t.hp=0;t.alive=false;if(team===0){hero.gold+=t.kind==='hero'?180:t.kind==='tower'?130:35;hero.xp+=t.kind==='hero'?100:25;levelUp();if(t.kind==='hero')kills[0]++}else if(t.kind==='hero')kills[1]++;if(t.kind==='core')finish(team===0)}}
function levelUp(){while(hero.xp>=hero.lv*100&&hero.lv<15){hero.xp-=hero.lv*100;hero.lv++;hero.max+=55;hero.hp=Math.min(hero.max,hero.hp+120);hero.atk+=7;toast('升级！等级 '+hero.lv)}}
function attack(u,t){if(!t||u.cd>0)return;u.cd=.85;let dmg=u.atk*(u.lv||1)*.56;if(u.job==='marksman')shots.push({x:u.x,y:u.y,t,team:u.team,dmg,spd:430});else hit(t,dmg,u.team)}
function ai(u,dt){if(!u.alive)return;u.cd=Math.max(0,u.cd-dt);if(u.kind==='minion'){let e=[...minions,...units].find(v=>v.alive&&v.team!==u.team&&v.lane===u.lane&&dist(v,u)<u.range);if(e){if(u.cd<=0)attack(u,e);return}u.progress+=(u.team?-1:1)*dt*.055;u.progress=Math.max(.02,Math.min(.98,u.progress));let p=pt(u.lane,u.progress);u.x=p.x;u.y=p.y;return}let e=nearest(u,220);if(e&&dist(u,e)<u.range+25){if(u.cd<=0)attack(u,e);return}let obj=towers.filter(t=>t.alive&&t.team!==u.team&&t.lane===u.lane).sort((a,b)=>dist(u,a)-dist(u,b))[0]||cores.find(x=>x.team!==u.team);if(obj&&dist(u,obj)<u.range+48){if(u.cd<=0)attack(u,obj);return}if(obj){let dx=obj.x-u.x,dy=obj.y-u.y,n=Math.hypot(dx,dy)||1;if(n>22){u.x+=dx/n*u.speed*dt;u.y+=dy/n*u.speed*dt}}}
function playerAttack(){if(!running||!hero.alive||hero.cd>0)return;let e=nearest(hero,hero.range+50)||towers.filter(t=>t.alive&&t.team===1).sort((a,b)=>dist(a,hero)-dist(b,hero))[0]||cores[1];if(e&&dist(e,hero)<hero.range+70)attack(hero,e);else toast('靠近敌方单位或防御塔才能攻击')}
function skill(n){if(!running||!hero.alive||skillcd[n]>0)return;skillcd[n]=n===2?18:7;if(choice==='support'&&n===0){hero.hp=Math.min(hero.max,hero.hp+hero.max*.3);units.filter(u=>u.team===0&&u.alive&&dist(u,hero)<180).forEach(u=>u.hp=Math.min(u.max,u.hp+180));toast('治愈之风！');return}let radius=n===2?240:145;[...units,...minions].filter(e=>e.alive&&e.team===1&&dist(e,hero)<radius).forEach(e=>hit(e,hero.atk*(n===2?2.8:1.65),0));if(n===2)towers.filter(t=>t.alive&&t.team===1&&dist(t,hero)<radius).forEach(t=>hit(t,hero.atk*1.3,0));toast(n===2?'终极技能释放！':'技能命中！')}
function joyMove(e){let r=$('joy').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,n=Math.hypot(dx,dy),m=36;if(n>m){dx*=m/n;dy*=m/n}$('stick').style.transform='translate('+dx+'px,'+dy+'px)';move={x:dx/m,y:dy/m}}
let touching=false;$('joy').addEventListener('pointerdown',e=>{touching=true;$('joy').setPointerCapture(e.pointerId);joyMove(e)});$('joy').addEventListener('pointermove',e=>{if(touching)joyMove(e)});function stopJoy(){touching=false;move={x:0,y:0};$('stick').style.transform='translate(0,0)'}$('joy').addEventListener('pointerup',stopJoy);$('joy').addEventListener('pointercancel',stopJoy);
[['atk',playerAttack],['s1',()=>skill(0)],['s2',()=>skill(1)],['ult',()=>skill(2)]].forEach(([id,fn])=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn()}));
function update(dt){time+=dt;if(time>wave*23)spawn();hero.x=Math.max(25,Math.min(975,hero.x+move.x*hero.speed*dt));hero.y=Math.max(25,Math.min(735,hero.y+move.y*hero.speed*dt));units.forEach(u=>ai(u,dt));minions.forEach(u=>ai(u,dt));minions=minions.filter(u=>u.alive);units.filter(u=>u.team===1&&u.alive&&dist(u,hero)<u.range+35).forEach(u=>{if(u.cd<=0)attack(u,hero)});towers.forEach(t=>{if(!t.alive)return;t.cd-=dt;if(t.cd<=0){let target=[...units,...minions,hero].filter(u=>u.alive&&u.team!==t.team&&dist(t,u)<175).sort((a,b)=>dist(t,a)-dist(t,b))[0];if(target){hit(target,68,t.team);t.cd=1.5}}});shots.forEach(s=>{if(!s.t.alive){s.dead=true;return}let dx=s.t.x-s.x,dy=s.t.y-s.y,n=Math.hypot(dx,dy),step=s.spd*dt;if(n<step){hit(s.t,s.dmg,s.team);s.dead=true}else{s.x+=dx/n*step;s.y+=dy/n*step}});shots=shots.filter(s=>!s.dead);skillcd=skillcd.map(v=>Math.max(0,v-dt));if(hero.hp<=0&&hero.alive){hero.alive=false;hero.respawn=8;kills[1]++;toast('被击败，8秒后复活')}if(!hero.alive){hero.respawn-=dt;if(hero.respawn<=0){hero.alive=true;hero.hp=hero.max;hero.x=130;hero.y=625;toast('英雄已复活')}}if(hero.alive&&dist(hero,cores[1])<hero.range+50&&hero.cd<=0)attack(hero,cores[1]);$('score').textContent=kills[0]+' : '+kills[1];$('clock').textContent=fmt(time);$('hpbar').style.width=Math.max(0,hero.hp/hero.max*100)+'%';$('mpbar').style.width=(100-Math.max(...skillcd)*4)+'%';$('lv').textContent='Lv.'+hero.lv;$('gold').textContent='金币 '+Math.floor(hero.gold);$('xp').textContent=Math.floor(hero.xp)+' XP'}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function project(x,y){let dx=x-hero.x,dy=y-hero.y;return{x:W/2+(dx-dy*.48)*S,y:H*.53+(dx*.30+dy*.30)*S}}
function ground(){g.fillStyle='#1e4235';g.fillRect(0,0,W,H);g.save();g.translate(W/2,H*.53);g.scale(S,S);g.translate(-hero.x,-hero.y);let gr=g.createLinearGradient(0,0,1000,760);gr.addColorStop(0,'#365e47');gr.addColorStop(1,'#1c3935');g.fillStyle=gr;g.fillRect(-200,-200,1400,1160);for(let i=0;i<110;i++){let x=i*173%1000,y=i*271%760;g.fillStyle=i%2?'#a9c18c19':'#0c211b33';g.beginPath();g.ellipse(x,y,20+i%5*4,9+i%4*3,.3,0,7);g.fill()}Object.values(lanes).forEach(a=>{g.beginPath();a.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.lineWidth=60;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#182e2a';g.stroke();g.lineWidth=48;g.strokeStyle='#777661';g.stroke();g.lineWidth=2;g.setLineDash([12,16]);g.strokeStyle='#e5d4a044';g.stroke();g.setLineDash([])});for(let i=0;i<20;i++){let x=(i*227+80)%1000,y=(i*157+30)%760;g.fillStyle='#0e241c77';g.beginPath();g.ellipse(x+6,y+8,24,12,0,0,7);g.fill();g.fillStyle=i%2?'#426d4b':'#65845a';g.beginPath();g.arc(x,y,18+i%4*4,0,7);g.fill()}g.restore()}
function drawUnit(u){if(!u.alive)return;let p=project(u.x,u.y);g.save();g.translate(p.x,p.y);g.scale(S,S);g.fillStyle='#0008';g.beginPath();g.ellipse(0,5,u.kind==='hero'?17:11,7,0,0,7);g.fill();g.fillStyle=u===hero?roles[choice].color:u.team?'#d87972':'#72c7df';g.beginPath();g.ellipse(0,-13,u.kind==='hero'?13:9,u.kind==='hero'?18:12,0,0,7);g.fill();g.fillStyle='#e9d8b8';g.beginPath();g.arc(0,-31,u.kind==='hero'?9:6,0,7);g.fill();g.fillStyle='#18211d';g.fillRect(-13,-47,26,4);g.fillStyle=u.team?'#ee8177':'#80d5ee';g.fillRect(-13,-47,26*Math.max(0,u.hp/u.max),4);if(u===hero){g.strokeStyle='#f3d99b';g.lineWidth=2;g.beginPath();g.arc(0,-17,19,0,7);g.stroke()}g.restore()}
function drawTower(t){let p=project(t.x,t.y);g.save();g.translate(p.x,p.y);g.scale(S,S);g.fillStyle='#0008';g.beginPath();g.ellipse(0,7,24,10,0,0,7);g.fill();g.fillStyle=t.team?'#81454a':'#315e75';g.fillRect(-14,-42,28,44);g.fillStyle=t.team?'#df9381':'#91cfe0';g.beginPath();g.moveTo(-20,-42);g.lineTo(0,-63);g.lineTo(20,-42);g.fill();g.fillStyle='#17211c';g.fillRect(-22,-70,44,5);g.fillStyle=t.team?'#e57d73':'#77d0e8';g.fillRect(-22,-70,44*t.hp/t.max,5);g.restore()}
function drawCore(t){let p=project(t.x,t.y);g.save();g.translate(p.x,p.y);g.scale(S,S);g.shadowBlur=24;g.shadowColor=t.team?'#ef786c':'#64d7fa';g.fillStyle=t.team?'#a84f4a':'#387f9e';g.beginPath();g.moveTo(0,-58);g.lineTo(27,-25);g.lineTo(15,5);g.lineTo(-15,5);g.lineTo(-27,-25);g.fill();g.shadowBlur=0;g.fillStyle='#f6e4ac';g.beginPath();g.arc(0,-27,9,0,7);g.fill();g.fillStyle='#101b18';g.fillRect(-32,-70,64,5);g.fillStyle=t.team?'#e87970':'#73d4f1';g.fillRect(-32,-70,64*t.hp/t.max,5);g.restore()}
function drawMap(){let w=200,h=145;mc.fillStyle='#214337';mc.fillRect(0,0,w,h);Object.values(lanes).forEach(a=>{mc.beginPath();a.forEach((p,i)=>i?mc.lineTo(p[0]/1000*w,p[1]/760*h):mc.moveTo(p[0]/1000*w,p[1]/760*h));mc.strokeStyle='#b4a984';mc.lineWidth=7;mc.stroke()});towers.forEach(t=>{if(t.alive){mc.fillStyle=t.team?'#ef8178':'#7ed8ec';mc.fillRect(t.x/1000*w-3,t.y/760*h-3,6,6)}});mc.fillStyle='#9de9fa';mc.beginPath();mc.arc(hero.x/1000*w,hero.y/760*h,5,0,7);mc.fill();units.forEach(u=>{if(u.alive){mc.fillStyle=u.team?'#f27f76':'#8bdcf0';mc.beginPath();mc.arc(u.x/1000*w,u.y/760*h,3,0,7);mc.fill()}})}
function draw(){ground();towers.forEach(drawTower);cores.forEach(drawCore);[...minions,...units,hero].sort((a,b)=>a.y-b.y).forEach(drawUnit);shots.forEach(s=>{let p=project(s.x,s.y);g.fillStyle=s.team?'#ffb08b':'#a7eaff';g.beginPath();g.arc(p.x,p.y,4,0,7);g.fill()});drawMap()}
function loop(now){if(!running)return;let dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}
function finish(win){running=false;$('end').classList.remove('hidden');$('result').textContent=win?'胜利 · 敌方水晶已摧毁':'失败 · 己方水晶失守';$('result').style.color=win?'#f0d28d':'#ef8b80';$('resultText').textContent='本局用时 '+fmt(time)+' · 击败英雄 '+kills[0]+' · 当前等级 '+hero.lv}
$('start').onclick=start;$('again').onclick=start;$('back').onclick=()=>{$('end').classList.add('hidden');$('overlay').classList.remove('hidden');$('hud').classList.add('hidden');running=false};$('help').onclick=()=>toast('左侧摇杆移动；普攻需接近目标；技能可对附近敌人造成范围伤害。');
})();
</script></body></html>
